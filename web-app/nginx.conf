server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Прокси на mock-api внутри Docker-сети.
    # Фронт всегда обращается к относительному /api/ — а nginx решает, куда это уходит.
    location /api/ {
        proxy_pass http://mock-api-service:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}